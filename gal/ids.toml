needs = "ui"
required = false

[[id]]
n = 1012
label = "world_clock"
kind = "static"
means = "The slot of the manager that holds the time of day."
needs = "place"
required = false

[[id]]
n = 1013
label = "camera"
kind = "static"
means = "The slot of the manager that holds the view."
