# ---- Functions ----

[[id]]
n = 2001
label = "task_add"
was = "register_task"
kind = "function"
means = "The function that adds a task to one of the game's task groups. Never called unless its verdict in the build's table is adds."
needs = "task_service"
required = true

[[id]]
n = 2002
label = "task_remove"
kind = "function"
means = "The function that removes a task from its group. EldenNet never calls it; it is kept so that it is never taken for task_add again."
needs = "task_service"
required = false

# ---- Classes: known by their run-time type information ----

[[id]]
n = 3001
label = "character"
kind = "class"
means = "The class every character object derives from: the set of method tables a character may carry."
needs = "world"
required = true

[[id]]
n = 3002
label = "player_character"
kind = "class"
means = "The class of a player's character object."
needs = "player"
required = true

# ---- Tables ----

[[id]]
n = 4001
label = "task_groups"
kind = "table"
means = "The table that names the game's task groups in order; a group's place in it is its index."
needs = "task_service"
required = false
