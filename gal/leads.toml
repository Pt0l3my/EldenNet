# What the derivation's offline round R0 looks for in the game's executable (eldennet-engine probe-exe --derive; O89).
# A lead says what to look for, by name and shape, never the bytes (ARCH §6.3, "What a lead may carry"). Every value
# below is one that EldenNet's own design documents already give, with the section it comes from; where they give
# nothing, the lead is left out, or marked for the in-game round R1 to find. The labels are ours, and only they reach
# derive.json. A lead is not a fact: nothing here is relied on until R0's report is reviewed and R1 and the self-tests
# confirm it (O89, ARCH §6.3 "Lead and confirmed").
schema = 1
product_name = "ELDEN RING"         # ARCH §6.3, gal/builds.toml's product_name, which the gate requires; compared,
                                    # as the gate compares it, once symbols such as a trademark sign are removed

[fd4]
path_suffix = "FD4Singleton.h"      # ARCH §6.2, the FD4 singleton finder's step 2 (ER01 §4)

# The FD4 singletons by the name the finder indexes them under (ARCH §6.2 step 4), from ARCH §6.1's object inventory:
# its eleven FD4 singletons, no more.
[singletons]
cs_task = "CSTask"                             # ARCH §6.1 CSTask; ER01 §3.2 (CSTaskImp, FD4 singleton "CSTask")
world_chr_man = "WorldChrMan"                  # ARCH §6.1 WorldChrMan; ER01 §4
cs_session_manager = "CSSessionManager"        # ARCH §6.1 CSSessionManager; ER01 §4
# The event flags (2026-11-22): the lead is the flags' store, the object the flags are read through (ER01 §9, ER07).
# ARCH §6.1 names CSEventFlagMan; four rounds found no object of that class anywhere, and the fourth found the
# store's object behind one of the accessor's statics from the title on (docs/ops/probes/2026-11-22-l5.md). The label
# and the catalogue's id (event_flags, 1008) stay: they mean the object the event flags are read through.
cs_event_flag_man = "CSFD4VirtualMemoryFlag"   # ER01 §9; ER07; was "CSEventFlagMan" (ARCH §6.1)
cs_fe_man = "CSFeMan"                          # ARCH §6.1 CSFeMan
cs_menu_man = "CSMenuMan"                      # ARCH §6.1 CSMenuMan; ER01 §4
cs_now_loading_helper = "CSNowLoadingHelper"   # ARCH §6.1 CSNowLoadingHelper, "confirm in S0-A"
world_area_time = "WorldAreaTime"              # ARCH §6.1 WorldAreaTime; ER01 §4
cs_camera = "CSCamera"                         # ARCH §6.1 CSCamera, "confirm in S0-A"
solo_param_repository = "SoloParamRepository"  # ARCH §6.1 SoloParamRepository; ER01 §4, §8.1
msg_repository = "MsgRepository"               # ARCH §6.1 MsgRepository; ER01 §4, §8.3

[register]
instance = "cs_task"                # ARCH §6.1: CSTask's instance pointer is passed to register_task (ER01 §3.2)

[task]
group = "ChrIns_PostPhysics"        # ARCH §3.2 and §6.3 ([task] group, checked on the first tick); DESIGN §0; ER01 §3.2
# The task base class: the design names none. ARCH §6.4 leaves the task object's shape (vtable_slots, run_slot,
# object_size) to S0-A, and ER01 §2.1 lists FD4TaskBase in the FD4 task system without its RTTI namespace or a word on
# whether every task derives from it. probe-exe requires this key, so it holds a marker of ours that no class of the
# game carries: R0 reports the task `missing`, and R1 must find the task base class, the run slot and the object size
# (derive.json's confirm list asks for task_run_slot and task_object_size either way). Not a lead: never read it as one.
base = "EldenNet::R1MustFindTaskBase"

[vtable_sets]
chr_ins = "CS::ChrIns"              # ARCH §6.2, the RTTI walk: every class that lists CS::ChrIns as a base (ER01 §5.2)
player_ins = "CS::PlayerIns"        # ARCH §6.2: CS::PlayerIns gets its own set

# The AOB statics of ARCH §6.1 that the design gives a class for. GameMan and FieldArea are left out: ARCH §6.1 makes
# them AOB statics but no design document gives the RTTI class of their instances, so R1 must find their classes and
# slots; they join these leads then, and their patterns follow with --static. register_task is derived through
# [register], not here.
[statics]
global_hinstance = { module = true }          # ARCH §6.1 global_hinstance: a static in .data holding the module's base
game_data_man = { rtti = "CS::GameDataMan" }  # ARCH §6.3, gal/patterns.toml's GameDataMan: rtti checked on the instance
# R0 found no RTTI of that class, and R0c no type descriptor of its name in any namespace: the class has no RTTI to
# find, its static cannot be found offline, and R1 finds its slot by what the instance holds (its rising-counter
# search), then the next offline round's --static game_data_man=<rva> cuts its pattern. The lead stays as ARCH §6.3
# gives it until then. R0c's results are in gal/builds.toml, gal/recipes.toml and gal/layouts/2.7.2.0-ww.toml.
# The game's state (2026-11-23, for the sixteenth read-only round): ARCH §6.1 calls the static GameMan and no design
# document gives the class of its instance, so the lead is that name itself, tried as the innermost name of the class
# of the object behind the slot, in whatever namespace. No static of the accessor's holds the object: the round's pair
# search finds the fields that read two saves' slots, and the one in an object of this class names the slot. The label
# is the catalogue's (game_state, 1003). A lead until a round's report shows it.
game_state = { rtti = "GameMan" }
