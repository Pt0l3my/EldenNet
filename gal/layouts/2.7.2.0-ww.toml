# The layout of 2.7.2.0 WW (ARCH §6.3), a lead file. It holds what our own rounds have given so far, and nothing guessed:
# - the task group's index, from the offline round R0c (2026-11-16);
# - the build's table (Lodestar; proposal 0005 §5), from the read-only round in game (L5, 2026-11-22;
#   docs/ops/probes/2026-11-22-l5.md): eight of the eleven managers' slots, each named by its instance's class and found
#   by the accessor's shape, with the places in the code that load it; the two character classes' tables of methods;
#   and the task groups' table. Each entry was checked against the image as loaded before the round wrote it, and the
#   reader then read the eight slots some 11,500 times with no fault. Every entry is still a lead: nothing is confirmed
#   before S0-A and the self-tests. event_flags, world_clock and messages are not here: the round could not name them.
# The classes, fields, enums, params and self-test ids are later rounds' to find (L6), and are left out. A release build
# refuses this file (every entry a lead).
schema = 2
build = "2.7.2.0-ww"
derived_from = "probe"
probe_record = "docs/ops/probes/2026-11-22-l5.md"

# R0c (2026-11-16; docs/ops/probes/2026-11-16-r0c.md): the group's name is found once in the image, as UTF-16, and one
# pointer to it, which lies in a table of 168 entries of 32 bytes in .rdata, each with a pointer to a UTF-16 name 16
# bytes from the entry's start; the group's entry is the 111th (index 110 from 0). No entry holds a field with its own
# index. It serves the game's task, which is no part of a v1 start (O101): the later task service's (proposal 0005 §9.6).
[task]
group = { name = "ChrIns_PostPhysics", index = 110 }
status = "lead"

# The build's table, as the read-only round wrote it (package 0.1.0-lodestar.3). tool_sha256 is the package's own
# SHA-256 of its eldennet.dll, set at the review: the round itself writes zeros there.
[provenance]
method = "own-derivation"
tool = "0.1.0-lodestar.3"
tool_sha256 = "9f531978fa7e9f1b5f7fd13d3c1cb3ddf53cba25bb9080b175e2893068cb2686"
round = "l5"
date = "2026-11-22"
leads = ["gal/leads.toml", "gal/recipes.toml"]

