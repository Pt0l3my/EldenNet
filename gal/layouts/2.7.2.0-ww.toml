# The event flags' store and the records of its tree (the ninth and tenth read-only rounds, packages
# 0.1.0-lodestar.12 and .13; docs/ops/probes/2026-11-22-l5.md). The store is the object behind item event_flags.
[class.world_clock]
copy_size = 0x20
status = "lead"
[class.world_clock.fields]
hour = { off = 0x8, ty = "bits", word = 8, shift = 34, width = 5, group = "place" }
minute = { off = 0x8, ty = "bits", word = 8, shift = 39, width = 6, group = "place" }

[class.save_data]
copy_size = 0xA8
status = "lead"
[class.save_data.fields]
play_time = { off = 0xA0, ty = "u32", group = "player" }

[class.event_flags]
copy_size = 0x48
status = "lead"
[class.event_flags.fields]
divisor = { off = 0x1C, ty = "u32", group = "flags" }
map = { off = 0x38, ty = "dlmap", group = "flags" }
holder_base = { off = 0x28, ty = "ptr", group = "flags" }

[class.flag_node]
copy_size = 0x40
status = "lead"
[class.flag_node.fields]
left = { off = 0x0, ty = "ptr", group = "flags" }
parent = { off = 0x8, ty = "ptr", group = "flags" }
right = { off = 0x10, ty = "ptr", group = "flags" }
key = { off = 0x20, ty = "u32", group = "flags" }
mode = { off = 0x28, ty = "u32", group = "flags" }
value = { off = 0x30, ty = "u64", group = "flags" }
