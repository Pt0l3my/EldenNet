# The layout of 2.7.2.0 WW (ARCH §6.3), a lead file. It holds what our own rounds have given so far, and nothing guessed:
# - the task group's index, from the offline round R0c (2026-11-16);
# - the build's table (Lodestar; proposal 0005 §5), from the read-only rounds in game (2026-11-22;
#   docs/ops/probes/2026-11-22-l5.md): ten of the eleven managers' slots, each named by its instance's class, the same
#   in eight sessions of the game. Nine were found by the accessor's shape, with the places in the code that load them;
#   among them event_flags, which stands for the object the event flags are read through (the flags' store, WHY§359).
#   The messages manager's slot no accessor's site loads: it is the one of two slots with one object that the code
#   refers to (238 instructions), with eight of them as witnesses. Then save_data, a static with no class to name it
#   by, found by what its object holds (the invariant recipe): the slot behind which one field rose by the clock in
#   nearly every pass of five sessions, the play time; 736 instructions refer to it, eight of them its witnesses.
#   Then the two character classes' tables of methods, and the task groups' table. Each entry was checked against the
#   image as loaded before the round wrote it, and the reader read the slots some 52,000 times over the six rounds
#   with no fault. Then world_clock, also by what its object holds: the static behind which the 8-byte word 8 bytes
#   in keeps the minute (six bits from bit 39) and the hour (five bits from bit 34); in the eighth round the minutes
#   went round four times with the hours stepping beside them, and in the seventh the hour went to 12 and to 20 when
#   the owner let time pass; 113 instructions refer to the static. Every entry of the table is still a lead; what
#   confirms a field is the rule below (WHY§614).
# - the event flags' fields (step L6; the ninth and tenth read-only rounds, 2026-11-23): in the store (event_flags)
#   the divisor (1,000) 28 bytes in, the holder of the blocks 40 bytes in and the tree's head 56 bytes in; in a record
#   of the tree (flag_node, 64 bytes) the three links, the key (the flags' group) 32 bytes in, the mode (1 in all
#   11,928 records) 40 bytes in and the block's index 48 bytes in. A block is 125 bytes at the holder plus its index
#   times 125. The tree was read whole in two sessions; it is ordered by the key with the first link the smaller
#   side; and for every bit seen to flip where the owner did something, the way from the head's parent down by the
#   key arrived at the record that names the bit's block. All of it is a lead.
# - the clock's and the play time's fields (step L6; the seventh to the eleventh rounds): in world_clock's object the
#   hour and the minute as runs of bits of the 64-bit word 8 bytes in (type bits: the word's size, the run's lowest
#   bit and its length); in save_data's object the play time in milliseconds, the 32-bit number 160 bytes in. Leads,
#   as all of this file.
# - the characters manager's places (the thirteenth read-only round, 2026-11-23, by search and class, the same with
#   two characters): the main player's address 0x1E508 into the manager's object; the near list at 0x1F1E8, three
#   addresses side by side (the start and the end are read), its elements 16 bytes, a character's address first and
#   a fraction 8 bytes in; the player set at 0x10EF8, an address of memory whose first word is the main player's
#   address. The manager's object is over 127 KiB, so each is a far field (read by a copy of its own; WHY§506). The
#   set's length and the element's size of the set are not known. Leads, as all of this file.
# - the game's state (the fifteenth and sixteenth read-only rounds, 2026-11-23): the static behind which one 32-bit
#   field, 0xAC0 into the object, read the slot of each of two saves as it was loaded (6, then 2), in an object of
#   the class the leads' [statics] give for the game's state, told by the image's own type information; 345
#   instructions refer to the static, eight of them its witnesses. The object is not there at the title. The field
#   lies past any sensible copy of the object's start, so it is a far field.
# - the player's parts (the thirteenth to the sixteenth rounds): the holder of a character's parts 0x190 into the
#   character's object, a run of addresses; its first address is the object with the health (the 32-bit number
#   0x138 in, which fell once at the owner's one hit and rose once at the one heal in two rounds, and its maximum
#   0x13C in, which never changed); its fourteenth (0x68 into the holder) the object with the position (three
#   fractions from 0x70: the first and the third ranged over metres while the owner walked, the second, the height,
#   moved in the one round where the ground was not level). Leads from the main player alone, by behaviour: no
#   other character was read, and several other numbers behaved as the health did.
# - read through EldenNet's own reader (the seventeenth read-only round, 2026-11-24; ErBackend::world_alone, once a
#   second for six minutes, no fault): the game's state's item passed the table's checks in the game; the save's
#   slot read 6 with the one save and 2 with the other, and kept its number at the title in between; the object at
#   the main player's word was of the player's class whenever a save was loaded; the health read below its maximum
#   after the owner's hit and equal to it after the heal, never above it; the position moved in 26 of the walk's 29
#   seconds and in none of the 107 standing ones; and the near list's first 48 elements held a character every
#   time, with a distance that never fell along the list in all but 8 of 12,720 elements read. The owner checked
#   the maximum against the game's status screen (2026-11-24). By the rule below the slot, the main player's word,
#   the near list and its element, the holder of parts, the health's part, the health and its maximum are
#   confirmed; the position and its part are not yet (the parts watch of that run did not list them, in the saddle).
# - a character's other fields (the eighteenth read-only round, twice, 2026-11-24: the character survey, by how
#   numbers stand among the 49 characters of a pass and over the session; no value was reported). The handle: the
#   eight bytes 0x8 in, different in every character and never changing, their upper half shaped as a map's id. The
#   kind's number 0x60 in: 26 values among 48 characters, the largest group 11, the main player's alone; and the
#   model's 0x64 in, which is the kind's number divided by 10,000 in 47 of the 48. The entity's id 0x1E8 in: an
#   id-sized number in 35 characters, each its own, and nothing in the other 14. The team 0x6C in: a small number, 10
#   values among the 48, the largest group 32. The on-screen bit: bit 4 of the byte 0x1C4 in, which flipped 80 and
#   101 times while the owner looked around and 4 and 0 times while they stood. The dead bit: bit 0 of the byte 0x1C6
#   in, set as a character's health went to nothing, clear in every one of 328 and 290 sightings of the living and
#   set in all 14 of the dead; bit 1 of that byte did the same in both runs, and bit 4 of 0x53B in the second, so
#   one death in each run does not tell them apart. Left out, for two candidates each: the type (a small number the
#   same in nearly all, 0x40 or 0x68 in) and the block (0x70 in, or the handle's upper half; 0x38 in changes as a
#   character moves). All leads, by behaviour alone.
# - a character's fields through EldenNet's own reader, and its type and block (the nineteenth read-only round,
#   2026-11-24). The reader read the seven fields above through this file, every two seconds, beside the survey: of
#   2,784 characters over 58 frames (48 a frame) each had a handle and no two in a frame shared one; 2,726 a kind's
#   number of an id's size, of which 2,652 with the model's number its own over 10,000; 2,053 an entity's id (36
#   different at most); 9 teams at most with 32 characters in the largest; two dead before the owner's kill and four
#   after it; and more on screen while the owner stood facing them than while they looked around. The main player's
#   own: a handle in every frame, a kind's number and the dead bit in none, a team no other shares in every one. The
#   survey of the same run counts the same. The type: of the two candidates, 0x68 in reads nothing for the main player
#   in all 24 passes and, for the others, the number the design's research gives a character of the world (5) in 1,127
#   of 1,151 sightings; 0x40 in reads nothing for the player too, but never that number. The block: 0x38 in is shaped
#   as a block's id for the main player in every pass and for the others in 856 of 1,151 sightings (it is not for
#   those that have no entity's id), is the main player's own number in 218 of them, equals the map's id of the
#   character (0x70 in, which is the handle's upper half in every character, the player included) in 796, and changed
#   in a few characters over the minutes and never in the standing player: where a character is now, as the design
#   means it. The dead bit's rivals: bit 1 of the byte 0x1C6 read as bit 0 in every sighting, the dead from the start
#   included, so the two are not told apart and bit 0 stays; bit 4 of 0x53B read otherwise in 7 sightings and is no
#   dead bit. Leads still: the player's block has not been seen to change at a crossing.
# - when a field is confirmed (WHY§614, Engine's ruling of 2026-11-24 applying the design's O4): for this build,
#   once three things hold in one run: EldenNet's own reader read it through this file in the game; a second,
#   independent reading agrees; and the behaviour that gives the field its meaning was seen at least once. Such a
#   field says status = "confirmed" itself; its class stays a lead until every field of it is. So far: from the
#   twelfth round the event flags' nine fields (the reader went through all of them to five flags, four of which the
#   owner had just set, and the round's own walk of the tree agreed on all five); from the seventeenth the fields
#   named above; from the nineteenth a character's handle, npc_param_id, model, entity_id, team and on_screen.
#   Waiting: dead (for the main player's own death), chr_type and block_id (for the reader), the position (for a
#   second reading in the reader's run), player_set, and the clock's fields and the play time, which the reader has
#   not read through this file in the game. The startup self-tests still run every session and stop a failing field
#   whatever its status.
# The other classes, fields, enums, params and self-test ids are later rounds' to find, and are left out. A release
# build refuses this file (its classes and items are leads still).
schema = 2
build = "2.7.2.0-ww"
derived_from = "probe"
probe_record = "docs/ops/probes/2026-11-22-l5.md"

# R0c (2026-11-16; docs/ops/probes/2026-11-16-r0c.md): the group's name is found once in the image, as UTF-16, and one
# pointer to it, which lies in a table of 168 entries of 32 bytes in .rdata, each with a pointer to a UTF-16 name 16
# bytes from the entry's start; the group's entry is the 111th (index 110 from 0). No entry holds a field with its own
# index. It serves the game's task, which is no part of a v1 start (O101): the later task service's (proposal 0005 §9.6).
[task]
group = { name = "ChrIns_PostPhysics", index = 110 }
status = "lead"

