# The layout of 2.7.2.0 WW (ARCH §6.3), a lead file. It holds what our own rounds have given so far, and nothing guessed:
# - the task group's index, from the offline round R0c (2026-11-16);
# - the build's table (Lodestar; proposal 0005 §5), from the read-only rounds in game (2026-11-22;
#   docs/ops/probes/2026-11-22-l5.md): ten of the eleven managers' slots, each named by its instance's class, the same
#   in six sessions of the game. Nine were found by the accessor's shape, with the places in the code that load them;
#   among them event_flags, which stands for the object the event flags are read through (the flags' store, WHY§359).
#   The messages manager's slot no accessor's site loads: it is the one of two slots with one object that the code
#   refers to (238 instructions), with eight of them as witnesses. Then save_data, a static with no class to name it
#   by, found by what its object holds (the invariant recipe): the slot behind which one field rose by the clock in
#   nearly every pass of five sessions, the play time; 736 instructions refer to it, eight of them its witnesses.
#   Then the two character classes' tables of methods, and the task groups' table. Each entry was checked against the
#   image as loaded before the round wrote it, and the reader read the slots some 52,000 times over the six rounds
#   with no fault. Every entry is still a lead: nothing is confirmed before S0-A and the self-tests. world_clock is not
#   here: it has no slot of its own, and where the time of day is kept is step L6's to find.
# The classes, fields, enums, params and self-test ids are later rounds' to find (L6), and are left out. A release build
# refuses this file (every entry a lead).
schema = 2
build = "2.7.2.0-ww"
derived_from = "probe"
probe_record = "docs/ops/probes/2026-11-22-l5.md"

# R0c (2026-11-16; docs/ops/probes/2026-11-16-r0c.md): the group's name is found once in the image, as UTF-16, and one
# pointer to it, which lies in a table of 168 entries of 32 bytes in .rdata, each with a pointer to a UTF-16 name 16
# bytes from the entry's start; the group's entry is the 111th (index 110 from 0). No entry holds a field with its own
# index. It serves the game's task, which is no part of a v1 start (O101): the later task service's (proposal 0005 §9.6).
[task]
group = { name = "ChrIns_PostPhysics", index = 110 }
status = "lead"

# The build's table, as the sixth read-only round wrote it (package 0.1.0-lodestar.9). tool_sha256 is the package's
# own SHA-256 of its eldennet.dll, set at the review: the round itself writes zeros there.
[provenance]
method = "own-derivation"
tool = "0.1.0-lodestar.9"
tool_sha256 = "1695053de0e0eef46304fc58242b0d437caa96385d762983bfb2d98f8b261b15"
round = "l5"
date = "2026-11-22"
leads = ["gal/leads.toml", "gal/recipes.toml"]

