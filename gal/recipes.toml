# Lodestar's recipes (proposal 0005 section 6; O102): how our own tools find an id in a build nobody has seen. A recipe
# is a shape in a grammar of our own over our own decoder's fields: which kind of instruction stands at each step and
# what it refers to. It holds no byte of the game, and no pattern cut from its code; gal/ holds numbers, our labels and
# shapes only. Each recipe has its note in derivations/<id>.md, in our own words (O27), and its provenance is our own
# derivation (O4, O48). Nothing here is relied on until a reviewed round and the self-tests confirm it (ARCH 6.3,
# "Lead and confirmed"): `builds` lists where that has happened, and is empty until then.
schema = 1

# The accessor: the short sequence the compiler writes wherever the game fetches one of its managers. It loads the
# manager's slot, tests what it loaded, skips ahead when it is set, and otherwise hands the manager's class object to a
# helper and reports, naming a source file whose path ends with the suffix below. The first step gives the slot (the
# static), the fourth the class object, the fifth the helper (the getter). It replaces patterns.toml's fd4_idiom, the
# same head as 24 bytes with wildcards, which is withdrawn (O102; derivations/accessor.md).
[[recipe]]
id = "accessor"
kind = "accessor"
section = ".text"
steps = ["load_slot", "test_loaded", "branch_set_short", "address_arg1", "call_relative"]
gives = { static = 0, class = 3, getter = 4 }
path_suffix = "FD4Singleton.h"      # ARCH 6.2, the finder's step 2
# Counted on the owner's own executable of 2.7.2.0 WW on 2026-11-22 (docs/ops/probes/2026-11-22-l3.md): the shape
# stands at 7,077 places, each accepted, reaching 217 statics through 217 class objects, one of each for the other.
# The withdrawn pattern had 7,151 hits and accepted 7,081: the same 7,077 and 4 more, where the test is of another
# register than the one just loaded, so the load there is of something else than the manager's slot. When a second
# build is counted the range widens to hold both.
expect_matches = [7077, 7077]
builds = []
provenance = { method = "own-derivation", leads = ["ARCH \u00A76.2", "ER01 \u00A74"], evidence = "docs/ops/probes/2026-11-16-r0c.md", date = "2026-11-21" }

# The accessor's other shapes (leads, 2026-11-22; not counted on any build yet). The compiler does not write every
# accessor the same way. R0c's own count of the places that load the accessor's path (docs/ops/probes/2026-11-16-r0c.md)
# found, beside the shape above, 26 places with five other heads, 1,379 that follow a 64-bit load of a static and 676
# that follow a compare of a RIP-relative quadword with zero, none of which the shape above stands at. And the second
# in-game round (docs/ops/probes/2026-11-22-l5.md) found a manager's object behind slots that are none of the 217
# statics. Each recipe below is one way the same accessor may be written; the finder counts each beside the accessor's
# own (hits, accepted, the statics it reaches that are new) and the in-game round names over the new statics too. A
# variant has no `expect_matches` until a round has counted it; none replaces the accessor's recipe, which discovery
# reads. Their notes are derivations/<id>.md.
[[recipe]]
id = "accessor_near"
kind = "accessor"
section = ".text"
steps = ["load_slot", "test_loaded", "branch_set_near", "address_arg1", "call_relative"]
gives = { static = 0, class = 3, getter = 4 }
path_suffix = "FD4Singleton.h"
builds = []
provenance = { method = "own-derivation", leads = ["ARCH \u00A76.2"], evidence = "docs/ops/probes/2026-11-16-r0c.md", date = "2026-11-22" }

