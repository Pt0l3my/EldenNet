<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>EldenNet Roadmap</title>
<!--
  EldenNet's roadmap, for EldenNet and GraceUI. Generated by tools/roadmap/build.py from docs/ROADMAP.md:
  edit the source, never this page. The template is tools/roadmap/page.html; the data sits in it as one
  JSON value. Adapted from the owner's Skyrizz roadmap page. The look is GraceUI's Grace theme (GraceUI
  DESIGN §3.2): its grounds, inks and golds, one dark theme. Nothing is fetched from anywhere: no script,
  font, image or style from outside, and the policy above forbids it. The fonts are named, never shipped:
  Grace's own faces when the reader has them, else the system's.
-->
<style>
[hidden] { display: none !important; }
html, body { margin: 0; }
:root {
  color-scheme: dark;
  /* Grace (GraceUI DESIGN §3.2): ground 1 the page, 0 the panels, 2 the cards, 3 raised, the well */
  --page: #161410;
  --panel: #100e0b;
  --card: #1d1a15;
  --raised: #26221b;
  --well: #0b0a08;
  --rule: rgba(201, 166, 90, .14);
  --rule-strong: rgba(201, 166, 90, .28);
  --edge: #7e7460;
  --ink: #e8e2d0;
  --ink-soft: #cfc6b1;
  --ink-dim: #a69d89;
  --ink-faint: #5f584b;
  --gold: #c9a65a;
  --gold-bright: #e3c579;
  --gold-wash: rgba(201, 166, 90, .08);
  --link: #94b6d2;
  /* the statuses: Grace's moss, ember, glint, mute ink and faint ink, and one lavender of our own for
     what waits on the owner; each reads at 4.5 to 1 or more on a card (tools/roadmap/test_build.py) */
  --st-done: #a3b37e;
  --st-active: #db9550;
  --st-next: #94b6d2;
  --st-planned: #a69d89;
  --st-waiting: #b9a0e6;
  --st-idea: #9a927f;
  --serif: "EB Garamond", Garamond, "Palatino Linotype", Georgia, serif;
  --display: "Cinzel", "EB Garamond", Garamond, Georgia, serif;
  --sans: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Noto Sans Mono", "Cascadia Mono", Consolas, ui-monospace, "SFMono-Regular", monospace;
  --rail-w: 214px;
  --col-gap: 28px;
  --hdr: 52px;
}
body { background: var(--page); color: var(--ink); font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: underline dotted; text-underline-offset: 3px; }
a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code, pre { font-family: var(--mono); font-size: 12.5px; }

/* ---------- the shell: band, rail, main (GraceUI's frame) ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); column-gap: var(--col-gap); padding-inline: clamp(16px, 2.2vw, 32px); }
.band { grid-column: 1 / -1; grid-row: 1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); column-gap: var(--col-gap); background: var(--page); border-bottom: 1px solid var(--rule); }
.rail-brand { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: var(--hdr); padding: 0 14px; border-right: 1px solid var(--rule); }
.wordmark { font: 600 15px/1 var(--display); letter-spacing: .32em; color: var(--gold); }
.rail-subtitle { font: 400 11px/1.2 var(--mono); color: var(--ink-dim); }
.topline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: var(--hdr); padding-block: 7px; box-sizing: border-box; min-width: 0; }
.topline .brand, .topline .brand-sep { display: none; }
.topline .brand { font: 600 13px/1 var(--display); letter-spacing: .3em; color: var(--gold); }
.topline .brand-sep { color: var(--ink-faint); }
.crumb { font: 600 16px/1.2 var(--serif); color: var(--ink); }
.asof { margin-left: auto; font: 400 11.5px/1.2 var(--mono); color: var(--ink-dim); }
.rail { grid-column: 1; grid-row: 2; position: sticky; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--hdr)); box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden auto; padding-block: 14px 12px; border-right: 1px solid var(--rule); }
.rail-list { display: contents; }
.rail-group { font: 500 10.5px/1 var(--sans); letter-spacing: .17em; text-transform: uppercase; color: var(--ink-dim); padding: 18px 14px 7px; }
.rail-group:first-child { padding-top: 4px; }
.rail-tab { display: flex; align-items: center; gap: 8px; flex: none; width: 100%; min-height: 36px; padding: 0 12px 0 11px; background: none; border: 0; border-left: 3px solid transparent; text-align: left; font: 400 15px/1.2 var(--serif); color: var(--ink); }
.rail-tab:focus-visible { outline-offset: -3px; }
.rail-tab:hover { background: var(--gold-wash); }
.rail-tab[aria-selected="true"] { background: var(--raised); border-left-color: var(--gold); color: var(--gold-bright); font-weight: 600; }
.rail-tab .count { margin-left: auto; font: 500 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 2px; color: var(--st-waiting); border: 1px solid currentColor; }
.rail-hint { margin-top: auto; font: 400 11px/1.4 var(--sans); color: var(--ink-dim); padding: 8px 14px 0; }
.main { grid-column: 2; grid-row: 2; min-width: 0; padding-block: 20px 48px; }
@media (max-width: 999.98px) {
  .app, .band { grid-template-columns: minmax(0, 1fr); }
  .rail-brand { display: none; }
  .topline .brand, .topline .brand-sep { display: inline; }
  .rail { grid-row: 2; position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: 8px; }
  .rail-list { display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; padding-block: 2px 4px; }
  .rail-group, .rail-hint { display: none; }
  .rail-tab { width: auto; min-height: 34px; border: 1px solid var(--rule); border-radius: 2px; padding: 0 11px; font-size: 14px; white-space: nowrap; }
  .rail-tab[aria-selected="true"] { border-color: var(--gold); }
  .main { grid-column: 1; grid-row: 3; padding-block: 16px 48px; }
}
@media (max-width: 560px) { .app { padding-inline: 16px; } .asof { display: none; } }

/* ---------- page heads, panels, text ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.page-title, .panel-title { display: flex; align-items: center; gap: 9px; margin: 0; font: 600 12.5px/1.2 var(--serif); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.page-title::before, .panel-title::before { content: ""; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }
.page-title:focus { outline: none; }
.head-right { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lede { margin: 16px 0 0; max-width: 80ch; color: var(--ink-soft); }
.panel { margin-top: 22px; padding: 16px 18px; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; min-width: 0; }
.panel-title { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 0 22px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.tile { padding: 12px 14px; background: var(--card); border: 1px solid var(--rule); border-left: 3px solid var(--ac, var(--gold)); border-radius: 3px; }
.tile .k { font: 500 10.5px/1.2 var(--sans); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-dim); }
.tile .v { margin-top: 6px; font: 600 24px/1.1 var(--serif); color: var(--ink); }
.tile .s { margin-top: 4px; font-size: 12.5px; color: var(--ink-dim); overflow-wrap: anywhere; }
.muted { color: var(--ink-dim); }
.wrap { overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 11px; background: none; border: 1px solid var(--rule-strong); border-radius: 2px; font: 500 12.5px/1 var(--sans); color: var(--ink); }
.btn:hover { border-color: var(--gold); }
.btn[aria-pressed="true"] { border-color: var(--ac, var(--gold)); color: var(--ink); background: var(--gold-wash); }
.btn[aria-pressed="false"] { color: var(--ink-faint); }
.btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac, var(--gold)); flex: none; }
.btn[aria-pressed="false"] .dot { background: transparent; border: 1px solid var(--ink-faint); }
.search { min-height: 30px; padding: 0 10px; width: min(260px, 100%); box-sizing: border-box; background: var(--well); border: 1px solid var(--rule-strong); border-radius: 2px; }
.search::placeholder { color: var(--ink-dim); }

/* the status pill and dot */
.st { --ac: var(--st-planned); display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px; border: 1px solid var(--ac); border-radius: 999px; font: 600 10.5px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ac); white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ac); }
.st-done { --ac: var(--st-done); } .st-active { --ac: var(--st-active); } .st-next { --ac: var(--st-next); }
.st-planned { --ac: var(--st-planned); } .st-waiting { --ac: var(--st-waiting); } .st-idea { --ac: var(--st-idea); }
.id { font: 500 12px/1.3 var(--mono); color: var(--gold); white-space: nowrap; }

/* ---------- overview ---------- */
.stage-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.stage-row:first-of-type { border-top: 0; }
.stage-row .t { font: 600 15px/1.3 var(--serif); }
.bar { grid-column: 2 / -1; height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-done { background: var(--st-done); } .bar .b-active { background: var(--st-active); } .bar .b-next { background: var(--st-next); }
.bar .b-waiting { background: var(--st-waiting); }
.stage-row .n { grid-column: 2 / -1; font-size: 12px; color: var(--ink-dim); }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--rule); }
.plist li:first-child { border-top: 0; }
.plist .sub { grid-column: 2; font-size: 12.5px; color: var(--ink-dim); overflow-wrap: anywhere; }
.plist .line { overflow-wrap: anywhere; }

/* ---------- the networks ---------- */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.net-box { margin-top: 14px; max-width: 100%; overflow: auto; background: var(--well); border: 1px solid var(--rule); border-radius: 3px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--rule-strong) transparent; }
.net-box svg { display: block; }
.net .lane { fill: var(--panel); }
.net .lane.alt { fill: #13110d; }
.net .lane-t { font: 600 12px var(--serif); letter-spacing: .08em; fill: var(--gold); }
.net .lane-s { font: 400 11px var(--sans); fill: var(--ink-dim); }
.net .node { cursor: pointer; outline: none; }
.net .node rect.box { fill: var(--card); stroke: var(--sc); stroke-width: 1.2; }
.net .node rect.acc { fill: var(--sc); }
.net .node .nid { font: 500 11px var(--mono); fill: var(--sc); }
.net .node .nt { font: 400 12px var(--sans); fill: var(--ink); }
.net .node .prog { fill: var(--st-done); }
.net .node .track { fill: var(--raised); }
.net .node:hover rect.box, .net .node:focus-visible rect.box { stroke-width: 2.4; }
.net .node.sel rect.box { stroke: var(--gold-bright); stroke-width: 2.6; }
.net .node.stub rect.box { fill: var(--panel); stroke-dasharray: 4 3; }
.net .node.stub .nt { fill: var(--ink-dim); font-size: 11px; }
.net .edge { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.net .edge.stage { stroke-dasharray: 5 4; stroke: #5f584b; }
.net .edge.lit { stroke: var(--gold); stroke-width: 2; }
.net .edge.down.lit { stroke: var(--st-next); }
.net.focus .node:not(.lit):not(.sel), .net .node.off { opacity: .22; }
.net.focus .edge:not(.lit) { opacity: .12; }
.net .s-done { --sc: var(--st-done); } .net .s-active { --sc: var(--st-active); } .net .s-next { --sc: var(--st-next); }
.net .s-planned { --sc: var(--st-planned); } .net .s-waiting { --sc: var(--st-waiting); } .net .s-idea { --sc: var(--st-idea); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-dim); }
.legend .sw { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--gold); }
.legend .sw.down { background: var(--st-next); }
.legend .sw.stage { background: repeating-linear-gradient(90deg, #7e7460 0 5px, transparent 5px 9px); }
#step-detail { scroll-margin-top: calc(var(--hdr) + 16px); }
.detail h2 { margin: 0; font: 600 20px/1.25 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.detail .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.detail p { margin: 8px 0 0; max-width: 85ch; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; margin-top: 12px; font-size: 13px; }
.kv dt { color: var(--ink-dim); font: 500 10.5px/1.9 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border: 1px solid var(--rule-strong); border-radius: 2px; font: 400 12px/1.6 var(--mono); color: var(--link); text-decoration: none; white-space: nowrap; }
.chip:hover { border-color: var(--gold); color: var(--ink); }
span.chip { color: var(--ink-soft); cursor: help; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ac, var(--st-planned)); }
.results { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- stages (foldable) ---------- */
details.stage, details.step { border-top: 1px solid var(--rule); }
details.stage { margin-top: 0; }
details > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "\203A"; width: 12px; color: var(--gold); font: 600 16px/1 var(--serif); transition: transform .12s; }
details[open] > summary::before { transform: rotate(90deg); }
details.stage > summary .t { font: 600 17px/1.3 var(--serif); }
details.step { margin-left: 22px; }
details.step > summary .t { font: 600 14.5px/1.3 var(--serif); }
.block-note { margin: 0 0 10px 22px; font-size: 13px; color: var(--ink-soft); max-width: 85ch; }
.parts { list-style: none; margin: 0 0 12px 44px; padding: 0; }
.parts > li { padding: 9px 0 9px 12px; border-left: 2px solid var(--ac, var(--rule)); margin-bottom: 6px; }
.parts .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.parts .gv { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); }
.parts .row { display: flex; flex-wrap: wrap; gap: 5px 7px; margin-top: 6px; align-items: center; font-size: 12px; color: var(--ink-dim); }
@media (max-width: 560px) { details.step { margin-left: 8px; } .parts { margin-left: 14px; } .block-note { margin-left: 8px; } }

/* ---------- references, how to edit ---------- */
.ref-group h3 { margin: 22px 0 8px; font: 600 12px/1.2 var(--serif); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.ref { display: grid; grid-template-columns: minmax(84px, max-content) minmax(0, 1fr); gap: 2px 14px; padding: 7px 0; border-top: 1px solid var(--rule); }
.ref .uses { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
.ref .uses a { font-family: var(--mono); }
.ref .where { grid-column: 2; font: 400 11.5px/1.4 var(--mono); color: var(--ink-dim); overflow-wrap: anywhere; }
@media (max-width: 560px) { .ref { grid-template-columns: minmax(0, 1fr); } .ref .uses { grid-column: 1; } }
pre { margin: 10px 0; padding: 12px 14px; background: var(--well); border: 1px solid var(--rule); border-radius: 3px; overflow: auto; white-space: pre; color: var(--ink-soft); line-height: 1.5; }
.edit p, .edit li { max-width: 85ch; }
.edit ul { padding-left: 20px; }
</style>
</head>
<body>
<div class="app">
  <header class="band">
    <div class="rail-brand"><div class="wordmark">ELDENNET</div><div class="rail-subtitle">Roadmap · with GraceUI</div></div>
    <div class="topline">
      <span class="brand">ELDENNET</span><span class="brand-sep" aria-hidden="true">&middot;</span>
      <span class="crumb" id="crumb" aria-live="polite">Overview</span>
      <span class="asof" id="asof"></span>
    </div>
  </header>
  <nav class="rail" aria-label="The roadmap's tabs">
    <div class="rail-list" role="tablist" aria-orientation="vertical" id="rail">
      <div class="rail-group" aria-hidden="true">The road</div>
      <button class="rail-tab" type="button" role="tab" data-tab="overview">Overview</button>
      <button class="rail-tab" type="button" role="tab" data-tab="roadmap">Roadmap</button>
      <button class="rail-tab" type="button" role="tab" data-tab="stages">Stages</button>
      <div class="rail-group" aria-hidden="true">The owner</div>
      <button class="rail-tab" type="button" role="tab" data-tab="waiting">Waiting on you <span class="count" id="wait-count"></span></button>
      <div class="rail-group" aria-hidden="true">Reference</div>
      <button class="rail-tab" type="button" role="tab" data-tab="references">References</button>
      <button class="rail-tab" type="button" role="tab" data-tab="edit">How to edit</button>
    </div>
    <div class="rail-hint" aria-hidden="true">Built from docs/ROADMAP.md</div>
  </nav>
  <main class="main" id="main">
    <section class="view" id="v-overview" role="tabpanel"></section>
    <section class="view" id="v-roadmap" role="tabpanel" hidden></section>
    <section class="view" id="v-stages" role="tabpanel" hidden></section>
    <section class="view" id="v-waiting" role="tabpanel" hidden></section>
    <section class="view" id="v-references" role="tabpanel" hidden></section>
    <section class="view" id="v-edit" role="tabpanel" hidden></section>
  </main>
</div>
<script>
"use strict";
const DATA = /*ROADMAP-DATA*/null;
const TABS = { overview: "Overview", roadmap: "Roadmap", stages: "Stages", waiting: "Waiting on you", references: "References", edit: "How to edit" };
const STATUS_WORD = { done: "Done", active: "Under way", next: "Next", planned: "Planned", waiting: "Waiting on you", idea: "Idea" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- the model ----------
const items = new Map();           // id -> {kind, it, stage, step}
const neededBy = new Map();
const allParts = [], allSteps = [];
for (const stage of DATA.stages) {
  items.set(stage.id, { kind: "stage", it: stage, stage });
  for (const step of stage.steps) {
    items.set(step.id, { kind: "step", it: step, stage, step });
    allSteps.push(step);
    for (const part of step.parts) { items.set(part.id, { kind: "part", it: part, stage, step }); allParts.push(part); }
  }
}
for (const [id, x] of items) for (const n of x.it.needs || []) { if (!neededBy.has(n)) neededBy.set(n, []); neededBy.get(n).push(id); }
const st = (id) => (items.get(id) ? items.get(id).it.status : "planned");
const isDone = (id) => st(id) === "done";
const needs = (id) => (items.get(id) ? items.get(id).it.needs || [] : []);
// what a part still waits on: its own needs, its step's and its stage's, those not yet done
function openNeeds(p) {
  const x = items.get(p.id);
  return [...new Set([...(p.needs || []), ...(x.step.needs || []), ...(x.stage.needs || [])])].filter((n) => !isDone(n));
}
// ready: not done, not an idea, and nothing it waits on left open
const ready = (p) => p.status !== "done" && p.status !== "idea" && openNeeds(p).length === 0;
// the lists, each defined once: the rail, the Overview and Waiting on you all read these
const WAITS = allParts.filter((p) => p.status === "waiting");
const WAIT_NOW = WAITS.filter(ready), WAIT_LATER = WAITS.filter((p) => !ready(p));
const NEXTS = allParts.filter((p) => (p.status === "next" || p.status === "planned") && ready(p));
const titleOf = (id) => (items.get(id) ? items.get(id).it.title : "");
const pill = (s) => `<span class="st st-${esc(s)}">${esc(STATUS_WORD[s] || s)}</span>`;
const idLink = (id) => `<a class="chip" style="--ac:var(--st-${esc(st(id))})" href="#roadmap~${esc(id)}" title="${esc(titleOf(id))}"><span class="dot"></span>${esc(id)}</a>`;
// a reference is named, with its title and document, never linked: the page reaches nothing outside itself
const refTip = (c) => { const r = DATA.refs[c] || {}; return [r.title, r.where].filter(Boolean).join(" · "); };
const refLink = (c) => `<span class="chip" tabindex="0" title="${esc(refTip(c))}">${esc(c)}</span>`;
function stepOf(id) { const x = items.get(id); return x ? (x.kind === "stage" ? null : x.step.id) : null; }

  const stepId = x ? (x.kind === "stage" ? (x.it.steps[0] || {}).id : x.step.id) : null;
  light($("road"), stepId, [...stepEdges.values()]);
  const box = $("step-detail");
  if (!stepId) { box.innerHTML = ""; shownStep = null; applyFilter(); return; }
  const step = items.get(stepId).it;
  if (shownStep !== stepId) {
    const stage = items.get(stepId).stage;
    box.innerHTML = `<div class="panel detail"><div class="meta"><span class="id">${esc(step.id)}</span>${pill(step.status)}<span class="muted" style="font-size:12px">${esc(stage.id)} ${esc(stage.title)}</span></div>
      <h2>${esc(step.title)}</h2>${step.note ? `<p>${esc(step.note)}</p>` : ""}
      <dl class="kv"><dt>Needs</dt><dd>${relList([...new Set([...stepEdges.values()].filter((e) => e.to === step.id).map((e) => e.from))])}</dd>
      <dt>Needed by</dt><dd>${relList([...new Set([...stepEdges.values()].filter((e) => e.from === step.id).map((e) => e.to))])}</dd>
      ${(step.refs || []).length ? `<dt>References</dt><dd><span class="chips">${step.refs.map(refLink).join("")}</span></dd>` : ""}</dl>
      <h3 class="panel-title" style="margin-top:18px">Its parts</h3><p class="muted" style="font-size:12.5px;margin:0">Dashed nodes are other steps' parts: on the left what these need, on the right what needs them. Choose one to go there.</p>
      <div class="net-box" id="parts-box"></div></div><div id="part-slot"></div>`;
    partEdges = drawParts(step);
    shownStep = stepId;
    const n = road.pos.get(stepId), rb = $("road-box");
    if (n && (n.x < rb.scrollLeft || n.x + n.w > rb.scrollLeft + rb.clientWidth)) rb.scrollLeft = Math.max(0, n.x - 40);
    box.scrollIntoView({ block: "start" });          // the chosen step's parts, in view below the road
  }
  const partId = x.kind === "part" ? id : null;
  light($("parts-svg"), partId, partEdges);
  const pn = partId && $("parts-svg").querySelector(`.node[data-id="${partId}"] rect.box`), pb = $("parts-box");
  if (pn) { const x = +pn.getAttribute("x"), w = +pn.getAttribute("width"); if (x < pb.scrollLeft || x + w > pb.scrollLeft + pb.clientWidth) pb.scrollLeft = Math.max(0, x - 24); }
  $("part-slot").innerHTML = partId ? partCard(x.it) : "";
  applyFilter();
}

// ---------- Stages ----------
function stagesView() {
  const part = (p) => `<li id="s-${esc(p.id)}" style="--ac:var(--st-${esc(p.status)})"><div class="head"><span class="id">${esc(p.id)}</span><span>${esc(p.title)}</span>${pill(p.status)}</div>
    ${p.gives ? `<p class="gv">${esc(p.gives)}</p>` : ""}
    ${(p.needs || []).length ? `<div class="row">Needs ${p.needs.map(idLink).join("")}</div>` : ""}
    ${(p.refs || []).length ? `<div class="row">Refs ${p.refs.map(refLink).join("")}</div>` : ""}</li>`;
  const block = (it) => `${it.note ? `<p class="block-note">${esc(it.note)}</p>` : ""}${(it.needs || []).length || (it.refs || []).length ? `<div class="row block-note" style="display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center;font-size:12px;color:var(--ink-dim)">${(it.needs || []).length ? "Needs " + it.needs.map(idLink).join("") : ""}${(it.refs || []).length ? " Refs " + it.refs.map(refLink).join("") : ""}</div>` : ""}`;
  $("v-stages").innerHTML = `<div class="page-head"><h1 class="page-title" tabindex="-1">Every stage, step and part</h1><div class="head-right"><button class="btn" type="button" id="open-all">Open all</button><button class="btn" type="button" id="close-all">Close all</button></div></div>
    <p class="lede">In the source's order. A part's needs link to it on the road; hold the pointer on a reference, or focus it, for its title and the document it is in.</p>
    ${DATA.stages.map((s) => `<details class="stage" id="s-${esc(s.id)}"${s.status === "active" ? " open" : ""}><summary><span class="id">${esc(s.id)}</span><span class="t">${esc(s.title)}</span>${pill(s.status)}</summary>${block(s)}
      ${s.steps.map((t) => `<details class="step" id="s-${esc(t.id)}"${t.status === "active" ? " open" : ""}><summary><span class="id">${esc(t.id)}</span><span class="t">${esc(t.title)}</span>${pill(t.status)}<span class="muted" style="font-size:12px">${t.parts.filter((p) => p.status === "done").length} of ${t.parts.length} done</span></summary>${block(t)}<ul class="parts">${t.parts.map(part).join("")}</ul></details>`).join("")}</details>`).join("")}`;
  $("open-all").addEventListener("click", () => { for (const d of $("v-stages").querySelectorAll("details")) d.open = true; });
  $("close-all").addEventListener("click", () => { for (const d of $("v-stages").querySelectorAll("details")) d.open = false; });
}
function openInStages(id) {
  const el = document.getElementById("s-" + id); if (!el) return;
  for (let d = el; d; d = d.parentElement) if (d.tagName === "DETAILS") d.open = true;
  el.scrollIntoView({ block: "start" });
}

// ---------- Waiting on you ----------
function waitingView() {
  const card = (p) => { const x = items.get(p.id); const open = openNeeds(p);
    return `<li><a class="chip" href="#roadmap~${esc(p.id)}" style="--ac:var(--st-waiting)"><span class="dot"></span>${esc(p.id)}</a><span class="line">${esc(p.title)}</span>
      <span class="sub">${esc(x.step.id)} ${esc(x.step.title)}${p.gives ? " — " + esc(p.gives) : ""}</span>
      ${open.length ? `<span class="sub">After ${open.map(idLink).join(" ")}</span>` : ""}</li>`; };
  const now = WAIT_NOW, later = WAIT_LATER;
  $("v-waiting").innerHTML = `<div class="page-head"><h1 class="page-title" tabindex="-1">Waiting on you</h1></div>
    <p class="lede">What only you can do: decisions to make, files and permissions only you can supply, sessions in game and releases. Drawn from the parts whose status is waiting.</p>
    <div class="grid2"><div class="panel"><h2 class="panel-title">Ready now (${now.length})</h2><ul class="plist">${now.map(card).join("") || '<li class="muted">Nothing yet.</li>'}</ul></div>
    <div class="panel"><h2 class="panel-title">Later (${later.length})</h2><ul class="plist">${later.map(card).join("") || '<li class="muted">Nothing.</li>'}</ul></div></div>`;
  $("wait-count").textContent = String(now.length);
  $("wait-count").title = now.length + " ready now, " + WAITS.length + " in all";
}

// ---------- References ----------
function referencesView() {
  const uses = new Map();
  for (const [id, x] of items) for (const r of x.it.refs || []) { if (!uses.has(r)) uses.set(r, []); uses.get(r).push(id); }
  for (const r of DATA.refs_top || []) { if (!uses.has(r)) uses.set(r, []); }
  const groups = [["decision", "Owner decisions"], ["graceui", "GraceUI"], ["section", "Sections"], ["document", "Documents"], ["task", "Tasks"], ["path", "Files"]];
  const num = (c) => c.replace(/\d+/g, (m) => m.padStart(5, "0"));
  const html = groups.map(([k, label]) => {
    const codes = [...uses.keys()].filter((c) => (DATA.refs[c] || {}).kind === k).sort((a, b) => num(a).localeCompare(num(b)));
    if (!codes.length) return "";
    return `<div class="ref-group" data-group="${k}"><h3>${label} (${codes.length})</h3>${codes.map((c) => `<div class="ref" data-text="${esc((c + " " + (DATA.refs[c].title || "")).toLowerCase())}"><span class="mono wrap">${esc(c)}</span><span class="wrap">${esc(DATA.refs[c].title || "")}</span>${DATA.refs[c].where ? `<span class="where">${esc(DATA.refs[c].where)}</span>` : ""}
      <span class="uses">${uses.get(c).length ? uses.get(c).map((id) => `<a href="#roadmap~${esc(id)}">${esc(id)}</a>`).join("") : '<span class="muted">the roadmap itself</span>'}</span></div>`).join("")}</div>`;
  }).join("");
  $("v-references").innerHTML = `<div class="page-head"><h1 class="page-title" tabindex="-1">References</h1><div class="head-right"><input class="search" id="rq" type="search" placeholder="Filter codes and titles" aria-label="Filter the references"></div></div>
    <p class="lede">Every code the roadmap uses, titled from EldenNet's wp index or its decisions file, with the document it is in; GraceUI's codes name GraceUI's documents. Under each, the parts that cite it.</p>${html}`;
  $("rq").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    for (const r of $("v-references").querySelectorAll(".ref")) r.hidden = !!q && !r.dataset.text.includes(q);
    for (const g of $("v-references").querySelectorAll(".ref-group")) g.hidden = ![...g.querySelectorAll(".ref")].some((r) => !r.hidden);
  });
}

// ---------- How to edit ----------
function editView() {
  $("v-edit").innerHTML = `<div class="page-head"><h1 class="page-title" tabindex="-1">How to edit</h1></div>
  <div class="edit"><p class="lede">The roadmap has one source, <code>docs/ROADMAP.md</code> in EldenNet's repository, written by hand and readable on GitHub as it is. It covers EldenNet and GraceUI. This page is built from it; never edit the page.</p>
  <div class="panel"><h2 class="panel-title">The source's format</h2>
<pre>## S10 v0.1 Eyes [planned]              a stage: its id, its title, a status
- needs: S8                             a stage's or step's own fields, not indented
### S10.2 EldenNet v0.1                 a step: the stage's id, a dot, a number
- S10.2.a The launcher [next]           a part: its id (or just its letter), title, status
  - needs: S10.1.a, b                   ids of anything; a bare letter is a part of this step
  - refs: DESIGN&#167;16.2, O5, G4, GraceUI:DESIGN&#167;10   codes or repository paths
  - gives: one line on what it gives</pre>
  <ul><li><b>Statuses</b>: ${DATA.statuses.map(pill).join(" ")}. Waiting means only the owner can do it.</li>
  <li>A part with no status is planned (once <code>tools/workplan/tasks.json</code> exists, it takes its tasks' status: done when all are done). A step or stage with none takes its parts'.</li>
  <li>Ids are never renumbered: a part that is dropped keeps its id with a note, and a new part takes the next free letter.</li>
  <li>Needs can cross steps and stages; a long line may wrap onto an indented next line. A line under a heading that is no field is the heading's note.</li>
  <li>References are the codes <code>wp show</code> knows (<code>DESIGN&#167;16.2</code>, <code>MEM&#167;12</code>, <code>SN04</code>, <code>ER07</code>, <code>REVIEW</code>), the owner's decisions (<code>O1</code> and on, in <code>docs/DECISIONS.md</code>), GraceUI's (<code>GraceUI:DESIGN&#167;10</code>, <code>G1</code> and on, <code>GraceUI:D67</code>, <code>GraceUI:docs/...</code>, checked when GraceUI's checkout sits beside EldenNet's) or paths in the repository.</li>
  <li>A part's id is written in full (<code>S10.2.a</code>), or as just its letter when that is the next letter in its step and the title after it does not start in lower case: <code>- a new part</code> is a part with no id, and reported.</li>
  <li>Typos are reported, never kept: a field name the format doesn't know, a status written wrong (<code>[Planed]</code>, <code>[next ]</code>, <code>[DONE]</code>), an empty title. Any other bracketed word at a title's end, such as a page's name (<code>[Pacing]</code>), stays in the title.</li>
  <li>Spike names (S0-A to S0-E, S1 to S10, X1 to X3, DESIGN &#167;16.1) in titles are spikes, never ids.</li></ul></div>
  <div class="panel"><h2 class="panel-title">The commands</h2>
<pre>python3 -I tools/roadmap/build.py --check   # ids, needs, statuses, fields, references, a stale page
python3 -I tools/roadmap/build.py           # writes docs/roadmap/index.html
python3 -I tools/roadmap/build.py --fragment FILE   # and FILE, to publish on claude.ai once swept
python3 -I tools/privsweep/privsweep.py files FILE  # the sweep, by hand, before every publish</pre>
  <p class="muted">Rebuild the page in the same commit as any edit to the source or the tool. The tests are tools/roadmap/test_build.py: <code>python3 -I -m unittest discover -s tools/roadmap</code>.</p></div></div>`;
}

overview(); roadmapView(); stagesView(); waitingView(); referencesView(); editView();
window.addEventListener("hashchange", route);
route();
</script>
