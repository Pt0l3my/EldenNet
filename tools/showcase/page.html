<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>EldenNet Showcase</title>
<!--
  EldenNet's showcase: what EldenNet is, the features designed so far and its menu. Generated by
  tools/showcase/build.py from docs/showcase/showcase.md: edit the source, never this page. The template is
  tools/showcase/page.html; the builder puts the page's body where the marker below stands. The look is GraceUI's
  Grace theme (GraceUI DESIGN §3): its grounds, inks and golds, its type roles and the lozenge rule, one dark theme.
  No script at all, and nothing is fetched from anywhere: the screenshots sit beside the page (or inside it, in
  the published copy), and the policy above forbids the rest. The fonts are named, never shipped: Grace's own
  faces when the reader has them, else the system's.
-->
<style>
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html, body { margin: 0; }
:root {
  color-scheme: dark;
  /* Grace (GraceUI DESIGN §3.2) */
  --well: #0b0a08;
  --ground-0: #100e0b;
  --ground-1: #161410;
  --ground-2: #1d1a15;
  --ground-3: #26221b;
  --ink-hi: #e8e2d0;
  --ink: #cfc6b1;
  --ink-mute: #a69d89;
  --ink-faint: #9a927f;
  --gold: #c9a65a;
  --gold-hi: #e3c579;
  --gold-deep: #8c6f35;
  --rule: rgba(201, 166, 90, .14);
  --rule-strong: rgba(201, 166, 90, .28);
  --edge: #7e7460;
  --glint: #94b6d2;
  /* the roadmap's statuses, as its page draws them: Grace's moss, ember, glint, mute and faint inks, and the
     roadmap's lavender for what waits on the owner; each reads at 4.5 to 1 or more on a card (the tests) */
  --st-done: #a3b37e;
  --st-active: #db9550;
  --st-next: #94b6d2;
  --st-planned: #a69d89;
  --st-waiting: #b9a0e6;
  --st-idea: #9a927f;
  /* GraceUI DESIGN §3.4: Cinzel for display, EB Garamond for prose and titles, Noto Sans for the interface */
  --display: "Cinzel", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --serif: "EB Garamond", Garamond, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Noto Sans Mono", "Cascadia Mono", Consolas, ui-monospace, "SFMono-Regular", monospace;
  --width: 1160px;
  --gutter: 32px;
  --band: 52px;
}
body {
  background: var(--ground-1);
  color: var(--ink);
  font: 400 15px/22px var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--gold-hi); text-decoration: underline; text-decoration-color: var(--gold-deep); text-underline-offset: 3px; }
a:hover { color: var(--ink-hi); text-decoration-color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .86em; color: var(--ink-hi); background: var(--ground-3); border-radius: 2px; padding: 1px 4px; }
strong { color: var(--ink-hi); font-weight: 600; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--gold); color: #15120c; padding: 6px 12px; z-index: 5; }
.skip:focus { left: 8px; }

/* ---------- the band: wordmark and the section links ---------- */
.band {
  position: sticky; top: 0; z-index: 3;
  background: var(--ground-0);
  border-bottom: 1px solid var(--rule-strong);
}
.band-in {
  max-width: var(--width); margin: 0 auto; padding: 0 var(--gutter);
  display: flex; align-items: center; gap: 28px; min-height: var(--band);
}
.wordmark {
  flex: none;
  font: 600 22px/1 var(--display); font-variant-caps: small-caps; letter-spacing: .04em;
  color: var(--gold); text-decoration: none;
}
.wordmark:hover { color: var(--gold-hi); }
.band nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
.band nav::-webkit-scrollbar { display: none; }
.band ul { display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; }
.band nav a {
  display: block; padding: 18px 0 16px; white-space: nowrap;
  font: 600 12px/16px var(--sans); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-mute); text-decoration: none; border-bottom: 2px solid transparent;
}
.band nav a:hover { color: var(--gold-hi); border-bottom-color: var(--gold-deep); }

/* ---------- the page ---------- */
main { max-width: var(--width); margin: 0 auto; padding: 0 var(--gutter) 24px; }
.hero {
  position: relative;
  padding: 64px 0 40px;
}
.hero::before {        /* the grace glow (GraceUI DESIGN §3.6): static, about 6% at its centre */
  content: ""; position: absolute; z-index: -1; left: -120px; top: -40px; width: 640px; height: 420px;
  background: radial-gradient(closest-side, rgba(201, 166, 90, .07), rgba(201, 166, 90, 0));
  pointer-events: none;
}
.eyebrow {
  margin: 0;
  font: 600 12px/16px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--gold);
}
h1 {
  margin: 10px 0 18px;
  font: 500 56px/60px var(--display); font-variant-caps: small-caps; letter-spacing: .03em; color: var(--ink-hi);
}
.lede { margin: 0; max-width: 40em; font: 400 21px/32px var(--serif); color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 24px 0 0; padding: 0; }
.facts li {
  padding: 5px 12px; border: 1px solid var(--rule-strong); border-radius: 2px; background: var(--ground-2);
  font: 500 13.5px/20px var(--sans); color: var(--ink);
}
.standing { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 22px 0 0; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 10px; border-radius: 999px; background: var(--ground-3); border: 1px solid var(--rule-strong);
  font: 600 13px/18px var(--sans); color: var(--ink-hi);
}
.pill::before {
  content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--st-waiting); flex: none;
}

/* sections, each under a lozenge rule (GraceUI DESIGN §3.6) */
.sec { padding-top: 56px; scroll-margin-top: calc(var(--band) + 8px); }
h2 {
  margin: 0 0 12px;
  font: 500 30px/36px var(--display); font-variant-caps: small-caps; letter-spacing: .03em; color: var(--ink-hi);
}
.lozenge { position: relative; height: 1px; margin: 0 0 24px 5px; background: var(--rule-strong); }
.lozenge::before {
  content: ""; position: absolute; left: -5px; top: -4px; width: 7px; height: 7px;
  border: 1px solid var(--gold-deep); background: var(--ground-1); transform: rotate(45deg);
}
.prose p, .prose li { font: 400 17px/26px var(--serif); color: var(--ink); }
.prose p { margin: 0 0 14px; max-width: 46em; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 22px; max-width: 46em; }
.prose li { margin: 0 0 8px; }
.prose ul > li::marker { color: var(--gold-deep); }
.prose h3 { margin: 24px 0 8px; font: 600 19px/26px var(--serif); color: var(--ink-hi); }

/* features: cards */
.cards {
  display: grid; gap: 16px; margin-top: 8px;
  grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr));
}
.card {
  display: flex; flex-direction: column;
  padding: 20px 22px 18px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground-2);
}
.card h3 { margin: 6px 0 8px; font: 600 19px/26px var(--serif); color: var(--ink-hi); }
.card .prose p, .card .prose li { font-size: 16px; line-height: 24px; }
.card .prose p:last-child { margin-bottom: 0; }
.design {
  margin: auto 0 0; padding-top: 14px;
  font: 400 12.5px/18px var(--mono); color: var(--ink-faint);
}

/* the menu: screenshots, one to a row so their text stays legible */
.shots { display: grid; gap: 44px; margin-top: 12px; }
.shot { margin: 0; }
.shot figcaption { margin: 0 0 12px; }
.cap-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.shot h3 { margin: 0; font: 600 19px/26px var(--serif); color: var(--ink-hi); }
.tag {
  padding: 2px 7px; border-radius: 2px; background: var(--ground-3);
  font: 600 11px/16px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute);
}
.shot figcaption .prose p { margin: 6px 0 0; font-size: 16px; line-height: 24px; max-width: 52em; }
.shot a { display: block; text-decoration: none; }
.shot img {
  display: block; box-sizing: border-box; width: 100%; height: auto; aspect-ratio: 16 / 9;
  border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--ground-0);
}
.shot a:hover img { border-color: var(--gold-deep); }

/* where it stands: the roadmap's stages */
.from-roadmap { margin: 22px 0 10px; color: var(--ink-faint); }
.stages { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.stages li {
  display: grid; align-items: baseline; column-gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--rule);
  grid-template-columns: 16px 44px minmax(0, 1fr) auto 210px;
  grid-template-areas: "dot sid title parts state";
}
.stages .dot { grid-area: dot; width: 7px; height: 7px; transform: rotate(45deg) translateY(-2px); background: currentColor; }
.stages .sid { grid-area: sid; font: 400 12.5px/18px var(--mono); color: var(--ink-faint); }
.stages .stitle { grid-area: title; font: 600 17px/24px var(--serif); color: var(--ink-hi); }
.stages .sparts { grid-area: parts; font: 400 13.5px/20px var(--sans); color: var(--ink-mute); white-space: nowrap; }
.stages .sstate { grid-area: state; font: 600 12px/16px var(--sans); letter-spacing: .1em; text-transform: uppercase; text-align: right; }
.st-done { color: var(--st-done); }
.st-active { color: var(--st-active); }
.st-next { color: var(--st-next); }
.st-planned { color: var(--st-planned); }
.st-waiting { color: var(--st-waiting); }
.st-idea { color: var(--st-idea); }
.more { margin: 18px 0 0; font: 400 17px/26px var(--serif); }

footer { border-top: 1px solid var(--rule-strong); background: var(--ground-0); margin-top: 64px; }
footer p {
  max-width: var(--width); margin: 0 auto; padding: 22px var(--gutter) 28px;
  font: 400 13.5px/20px var(--sans); color: var(--ink-mute);
}

@media (max-width: 760px) {
  :root { --gutter: 16px; }
  /* narrow: the band scrolls away, and its links wrap under the wordmark, every one in sight */
  .band { position: static; }
  .band-in { flex-wrap: wrap; gap: 0; padding-top: 14px; padding-bottom: 6px; }
  .wordmark { flex-basis: 100%; font-size: 20px; margin-bottom: 4px; }
  .band nav { overflow: visible; }
  .band ul { flex-wrap: wrap; gap: 0 18px; }
  .band nav a { padding: 8px 0 6px; }
  .sec { scroll-margin-top: 8px; }
  .hero { padding: 40px 0 28px; }
  .hero::before { left: -160px; width: 480px; }
  h1 { font-size: 42px; line-height: 48px; }
  .lede { font-size: 19px; line-height: 29px; }
  .sec { padding-top: 44px; }
  h2 { font-size: 26px; line-height: 32px; }
  .card { padding: 18px 16px 16px; }
  .shots { gap: 36px; }
  .stages li { grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "dot title state" ". parts parts"; }
  .stages .sid { display: none; }
  .stages .sstate { white-space: nowrap; }
  .shot a::after {      /* only beside the repository's files: the published copy has no link */
    content: "Open at full size \2197"; display: block; margin-top: 6px;
    font: 400 13.5px/20px var(--sans); color: var(--gold-hi);
  }
}
@media print {
  .band { position: static; }
  .hero::before { display: none; }
}
</style>
</head>
