# ---- Settings: those v0.1 reads whose home is on these pages (PAGES §4.5's debug.*). Their effect is v0.1's own: the
# F11 view is made at the connect and the recorder opened at the core's start, so both wait for the next launch, and
# the log's detail changes at once (PAGES §4.1 item 3: a row says whether it works now).

[[setting]]
key = "debug.panel"
type = "bool"
default = false
label = "Developer views"
help = "Turns on the F11 debug view in game, for testers. It shows EldenNet's own numbers and words, never story or chat. Takes effect the next time the game starts."
synonyms = ["debug", "F11", "developer", "view"]
home = "settings.developer"
effect = "next_launch"
availability = "live"
sensitive = true  # SP8's developer view: switched on at this PC alone (D221)

[[setting]]
key = "debug.record_sessions"
type = "bool"
default = false
label = "Record sessions"
help = "Keeps a recording of each session's numbers, with no text and no names, for the developers' replay tools. Takes effect the next time the game starts."
synonyms = ["recording", "record", "replay"]
home = "settings.developer"
effect = "next_launch"
availability = "live"
sensitive = true  # what is written to this PC's disk each session (PV8): at this PC alone (D221)

[[setting]]
key = "debug.log_level"
type = "choice"
default = "info"
choices = [{ value = "error", label = "Errors only" }, { value = "warn", label = "Warnings" }, { value = "info", label = "Normal" }, { value = "debug", label = "Detailed" }]
label = "Log detail"
help = "How much EldenNet writes to its log. Detailed helps with a bug report; Normal is enough otherwise. Changes at once."
synonyms = ["log", "logging", "verbose", "level"]
home = "settings.developer"
effect = "now"
availability = "live"

# The AI pages' settings: the preset in use, providers.toml's `preset`, and each job's provider, model and fallback, its
# `[slots.<slot>]` (PAGES §4.5's row per slot, home AI › Models, on the job's card): pickers (GraceUI D193), a
# provider's choices the providers of providers.toml, a model's what its provider lists, their values the job's now,
# the preset's or the ones chosen. A provider chosen that does not list the job's model (or its fallback) waits for one
# of its models. A reset of the job's provider or model clears the job's pick, its fallback with it, so the preset's
# hold again; a reset of either fallback row clears the fallback alone; a picker's Default (D199) is the row's reset.
# The job's rows count as changed only while providers.toml holds a model for it, its fallback rows while it holds a
# fallback (D198), so their help says what Default means. A fallback is chosen only for a job with a model of its own.
# Their effect is the next request: en-llm takes a changed configuration at once. Keys are no settings rows since
# GraceUI 0.2.8: each is its provider's row secret on Providers (D194). The local presets wait for Find local servers.

[[setting]]
key = "ai.preset"
type = "choice"
default = "cloud-budget"
choices = [{ value = "cloud-budget", label = "Cloud budget, on OpenRouter" }, { value = "cloud-nanogpt", label = "Cloud, on NanoGPT" }, { value = "custom", label = "Custom" }]
label = "Preset"
help = "Which models do the jobs. Cloud budget, on OpenRouter, suits most players; Custom keeps what your providers file says. A new preset adds its provider to Providers, where its key goes."
synonyms = ["preset", "models", "cloud", "openrouter", "nanogpt"]
home = "ai.models"
effect = "next_request"
availability = "live"

[[setting]]
key = "slots.dialogue.provider"
type = "text"
choices_from = "ai.choices.providers"
default = ""
label = "Conversation's provider"
help = "Where Conversation's calls go: one of the providers on Providers. If it does not list the job's model, choose one of its models below. Default: the preset's provider."
synonyms = ["provider", "conversation", "dialogue", "chat"]
home = "ai.models"
effect = "next_request"
availability = "live"

[[setting]]
key = "slots.dialogue.model"
type = "text"
choices_from = "ai.choices.dialogue"
default = ""
label = "Conversation's model"
help = "The model that answers when you talk to a character, from the models its provider lists. Reset it to use the preset's provider, model and fallback again. Default: the preset's model."
synonyms = ["model", "conversation", "dialogue", "chat"]
home = "ai.models"
effect = "next_request"
availability = "live"

[[setting]]
