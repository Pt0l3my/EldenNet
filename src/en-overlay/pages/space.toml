# EldenNet's space (PAGES §2; GraceUI's G20, D160 and eldennet-changes §19): its rail, pages, topics, commands and
# settings, in GraceUI's page format. tools/pages/build.py turns it into the protocol's JSON (pages.json and
# settings.json beside this file) and into src/en-overlay/src/space_data.cpp, which eldennet.dll hands to GraceUI at
# register_pages; GraceUI's own lint checks it in CTest (en_pages_lint, from a pinned GraceUI).
#
# The first slice (roadmap S11.4.a): Home and System as far as v0.1 has data, and Settings › Developer, the home of the
# developer settings v0.1 reads (PAGES §4.5). The second: AI's Providers, Models and Self-test (PAGES §4.6.2), as far as
# the engine has them: the presets of O88 and their providers, the providers' health, and the model list and the
# self-test as long commands. The third, on GraceUI 0.2.8's protocol 1.2 (D192 to D196, G34): a Remove and a key on each
# provider's row, a small form for a provider of one's own, and a model picker for each job, its choices what the job's
# provider lists. The fourth, on GraceUI 0.2.9 (D197, D198): a provider picker for each job, a key's Refused and Not
# needed, and the changed mark of a job's rows only where the player's providers file holds a pick for it. The fifth, on
# GraceUI 0.2.12 (D202, protocol 1.3): AI › Models as one card per job, each a section with the job's slot as its chip,
# its state as its live status, its provider, model and fallback, and its fixed budgets.
# The profile editor (S7.2.b), on GraceUI 0.2.22 (D215 to D218, protocol 1.7): Characters › Named NPCs, the roster as the
# page's master list (`named.list`), each profile's general profile (the family `named`) and the player's own layer in an
# editor block (the family `profiles`), with its five commands, `profile.draft` a slow one (D216). And, for GraceUI
# 0.2.25's devices at home (G9, D221; protocol 1.8, which an older GraceUI reads past): the commands and settings a
# paired device may never send or change, marked sensitive.
# The rail holds every category of PAGES §4.2.1 in its order; a category with no page yet holds none,
# and GraceUI shows no category that is empty (D173). Every word a player reads here is a draft for the owner's review
# (the slice's notes list them). Names of the game's places and characters never appear here (PAGES §4.1 item 6, SP3).

[space]
id = "eldennet"
name = "EldenNet"
settings_schema = 2
commands = ["settings.set", "settings.reset", "selftest.run", "models.list", "providers.add", "providers.remove",
            "providers.key", "profile.check", "profile.save", "profile.reset", "profile.restore", "profile.draft"]
# A model's draft of the player's notes: answered within 90 s (D216; NPC §4.7's 20 s to the first token, 60 s in all).
slow_commands = ["profile.draft"]
# From this PC alone, never a paired device (G9, D221; S11.4.e): a provider of one's own with its address, a provider's
# removal, and a key (a row secret, which GraceUI refuses from a device whether marked or not); and, by the owner's O112
# (b), the profile editor's writing commands: the player's notes are saved, reset and restored on this PC alone.
sensitive_commands = ["providers.add", "providers.remove", "providers.key", "profile.save", "profile.reset",
                      "profile.restore"]

