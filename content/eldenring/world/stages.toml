[[world_stage]]
id         = "capital_ashen"
when       = "boss('maliketh') && world('erdtree_burned')"
reach      = "region"
regions    = ["leyndell", "altus"]
near       = "fact"
rank       = 95
spoiler    = 3
supersedes = ["w:erdtree_burned"]
short      = "the royal capital buried in ash"
line       = "The great tree has burned, and the royal capital lies buried under grey ash."
topics     = ["ash", "ashen", "capital", "buried", "grey"]
lexicon    = []
note       = "The capital under ash, after the tree burned. A lead, likely only. Our words."
