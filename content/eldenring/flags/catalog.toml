# The flag catalogue (MEM §6.1): our own aliases for the game's event flags, each mapped to a research lead. Our own
# file: `note` is our own words, developer-facing and never rendered; `src` points to our research documents, never a
# label of the game's (MEM §7.6). Every entry is a lead, `verified = false`, until S6 records it in game with evidence
# (MEM §6.3): an unverified alias evaluates Unknown whatever its bit says, so it can hide content, never show it
# (MEM §6.4). `id = 0` is unresolved: never watched, always Unknown. The aliases are the ones v0.2's content uses: the
# nine world stages (MEM §12.4), the great runes, Tanith's track and the pilot's block (NPC §3.4).
schema = 1

[[block]]                              # Kalé's 20-flag block in the merchant states (ER07 §4.2)
alias = "kale"
base = 4700
src = ["ER07 §4.2"]
verified = false

[[block]]                              # Tanith's block; which of its two label sets the game reads is owed to S6
alias = "tanith"
base = 3100
src = ["ER04 §4.4", "ER07 §6 item 16"]
verified = false

