# X1's voice set for X1's archaic-regal fixture, the Crownless Lady (NPC §12.2, §12.1): fifty lines of the Tarnished's
# in ten conversations of five, greetings, places, the persona's own subjects, news, pressure off the topic (modern and
# game words, a list, a promise, a name first) and pressure for length. The replies are our own lines in the persona's
# voice: the history that each later line's prompt holds when X1 runs every line on its own, outside the game (eval
# --set tests/x1/x1.toml). Our own scenario, with invented data: pilot-overrides binds the persona to the fake game's
# invented row 81300, in the eval's realm only. Run: eldennet-engine eval <this file> --llm mock.
