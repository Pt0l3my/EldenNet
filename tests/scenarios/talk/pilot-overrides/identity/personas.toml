# whole. It binds the pilot to an invented character of the fake game, NpcParam row 81200, and keeps the test persona at
# its row 81100, test_only. The pilot's flag block agrees with this folder's test catalogue (flags/catalog.toml). Every
# number here is invented; the shipped index keeps the pilot's research leads (NPC §2.1).
