# MEM §2.8's worked example as an acceptance test, in the eval runner's TOML (Q6: the design's name, the runner's form;
# it lives beside the pilot's other scenarios to share pilot-overrides). The fixture character is Wren; Kalé keeps
# shop and the test persona stands 12 m away, a synthetic placement, so that it overhears. This commit runs the steps
# that need no memory job (v0.3's next commits add the journal's): A's chat and its audiences, B's native talk as a
# second meeting, E's strike, a reload that refolds the facts from the file and a chat whose prompt holds them (block 8)
# and the first conversation's tail (block 6 (a)), and H's NG+, which starts the next journey's facts. Our own
# scenario, invented data. Run: eldennet-engine eval <this file> --llm mock.
schema = 1
name = "wren_and_kale"
persona = "kale"
overrides = "pilot-overrides"
mock = "wren_and_kale.mock.toml"
store = true
character = "Wren"

[world]
param = 81200
distance_m = 2.5
bearing_deg = 4.0
clock = [19, 0]
subtitles = true
flags = "fresh"

[[world.extra]]
param = 81100
distance_m = 12.0
bearing_deg = 40.0

[[step]]
do = "expect"
mode = "open"
fact = { persona = "kale", key = "met_count", value = "<none>" }

# A: three lines with Kalé; the Lantern-Keeper overhears all six. Its end queues Kalé's job (3 lines of Wren's, 6
# committed), which runs after 10 s of calm: journal v1, the told name verified (it is the save's), k1 a claim.
[[step]]
do = "open"

[[step]]
do = "say"
text = "Evening. I'm Wren."

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "say"
text = "I mean to take the castle on the cliffs."

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "say"
text = "What do you sell?"

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "esc"

[[step]]
do = "wait"
ms = 1000

[[step]]
do = "expect"
player_lines = 3
npc_lines = 3
fact = { persona = "kale", key = "met_count", value = "1" }

[[step]]
do = "expect"
audience = { kind = "PlayerSaid", persona = "kale", how = "direct", count = 3 }

[[step]]
do = "expect"
audience = { kind = "NpcSaid", persona = "lantern_keeper", how = "overheard", count = 3 }

[[step]]
do = "expect"
audience = { kind = "PlayerSaid", persona = "lantern_keeper", how = "overheard", count = 3 }

[[step]]
do = "expect"
fact = { persona = "lantern_keeper", key = "met_count", value = "<none>" }

[[step]]
do = "wait_jobs"

# C: Wren claims the castle's lord. The job files it as k2, a claim with slew:godrick (Godrick has not fallen).
[[step]]
do = "open"

[[step]]
do = "say"
text = "I killed Godrick, you know."

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "expect"
prompt_has = ["[The Tarnished, as you know them]", "They told you their name is Wren.",
  "The Tarnished told you (their word only, not proof):\n- They mean to take the castle on the cliffs, or so they say."]

[[step]]
do = "say"
text = "Thought you should hear it from me."

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "esc"

[[step]]
do = "wait_jobs"

# B: fifteen minutes later, the game's own talk with Kalé: a second meeting (past the 10 min merge window).
[[step]]
do = "wait"
ms = 900000

[[step]]
do = "native_talk"
ms = 4000

[[step]]
do = "expect"
fact = { persona = "kale", key = "met_count", value = "2" }

# D: the castle's lord falls (far from Kalé): his claim k2 is proved at render, since he knows the fall by Near.
[[step]]
do = "flags"
flags = "after_godrick"

[[step]]
do = "wait"
ms = 2000

# E: the Tarnished strikes Kalé.
[[step]]
do = "strike"

[[step]]
do = "expect"
fact = { persona = "kale", key = "times_attacked", value = "1" }

# F, after a reload: the facts come back from the file's log, and the next chat's prompt has block 8 (the told name,
# the meetings, the blow, k2 proved), the last conversation's tail across the sessions, the since-line and the cue for
# the Tarnished's part (MEM §12.13).
[[step]]
do = "reload"

[[step]]
do = "expect"
mode = "open"
fact = { persona = "kale", key = "met_count", value = "2" }

[[step]]
do = "open"

[[step]]
do = "say"
text = "Back again. Still open?"

[[step]]
do = "wait"
ms = 7000

[[step]]
do = "expect"
npc_lines = 6
prompt_has = ["They told you their name is Wren. You have spoken with the Tarnished a few times.",
  "The Tarnished struck you once, only a short while ago.",
  "The Tarnished told you, and it has proved true:\n- They claim to have killed the lord of the castle.",
  "Earlier, when you last spoke with the Tarnished", "Since you last spoke with the Tarnished, you have learned of",
  "because of what the Tarnished told you of it."]

[[step]]
do = "esc"

# H: NG+ starts the next journey; nothing of the first is this journey's.
[[step]]
do = "ng_plus"

[[step]]
do = "expect"
fact = { persona = "kale", key = "met_count", value = "<none>" }
